name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.2'

      - name: Setup project
        run: |
          PUB=$(find . -name "pubspec.yaml" | head -n 1 | xargs dirname)
          echo "PUB_DIR=$PUB" >> $GITHUB_ENV

      - name: Fix desugaring for notifications - KEEPS notifications
        run: |
          cd $PUB_DIR
          flutter create . --platforms=android --project-name quickgo
          
          # Overwrite build.gradle with a 100% working version for flutter_local_notifications
          cat > android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }
          android {
              namespace "com.example.quickgo"
              compileSdk 34
              ndkVersion flutter.ndkVersion
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
                  coreLibraryDesugaringEnabled true
              }
              kotlinOptions {
                  jvmTarget = '1.8'
              }
              defaultConfig {
                  applicationId "com.example.quickgo"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          flutter {
              source '../..'
          }
          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
          }
          EOF
          cat android/app/build.gradle

      - name: Build APK with notifications
        run: |
          cd $PUB_DIR
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickGo-APK-With-Notifications
          path: ${{ env.PUB_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
