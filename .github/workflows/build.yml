name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Find project
        run: |
          PUB=$(find . -name "pubspec.yaml" | head -n 1 | xargs dirname)
          echo "PUB_DIR=$PUB" >> $GITHUB_ENV

      - name: Recreate android if missing
        run: |
          cd $PUB_DIR
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            flutter create . --platforms=android
          fi

      - name: Fix desugaring with Python
        run: |
          cd $PUB_DIR
          python3 << 'PY'
          import pathlib, re
          f = pathlib.Path("android/app/build.gradle")
          if not f.exists():
              f = pathlib.Path("android/app/build.gradle.kts")
          text = f.read_text()
          
          # 1. Ensure compileOptions has desugaring enabled
          if "isCoreLibraryDesugaringEnabled" not in text and "coreLibraryDesugaringEnabled" not in text:
              text = text.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        coreLibraryDesugaringEnabled true")
          else:
              text = text.replace("isCoreLibraryDesugaringEnabled = false", "isCoreLibraryDesugaringEnabled = true")
              text = text.replace("coreLibraryDesugaringEnabled false", "coreLibraryDesugaringEnabled true")

          # 2. Add desugar dependency
          if "desugar_jdk_libs" not in text:
              text = text.replace("dependencies {", "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'")

          f.write_text(text)
          print(f.read_text()[-1000:])
          PY

      - run: cd $PUB_DIR && flutter pub get
      - run: cd $PUB_DIR && flutter build apk --debug --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: QuickGo-APK
          path: ${{ env.PUB_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
