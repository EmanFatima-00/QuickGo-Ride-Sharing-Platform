name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Find project and auto-fix pubspec
        run: |
          PUB=$(find . -name "pubspec.yaml" | head -n 1 | xargs dirname)
          echo "PUB_DIR=$PUB" >> $GITHUB_ENV
          echo "Found $PUB"
          # Auto-disable the breaking library inside workflow itself
          sed -i 's/.*flutter_local_notifications/# &/' $PUB/pubspec.yaml || true
          echo "Patched pubspec:"
          cat $PUB/pubspec.yaml | grep -A2 -B2 notification || true

      - name: Auto-fix dart files
        run: |
          cd $PUB_DIR
          # Comment out any import of flutter_local_notifications automatically
          find lib -type f -name "*.dart" -exec sed -i 's/.*flutter_local_notifications/\/\/ &/' {} \; || true
          find lib -type f -name "*.dart" -exec sed -i 's/.*FlutterLocalNotifications/\/\/ &/' {} \; || true

      - name: Recreate android
        run: |
          cd $PUB_DIR
          flutter create . --platforms=android --project-name quickgo || true

      - name: Build APK
        run: |
          cd $PUB_DIR
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickGo-APK-Final
          path: ${{ env.PUB_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
